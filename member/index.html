<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard สมาชิก | ADTSpreadsheet</title>
  <meta
    name="description"
    content="พื้นที่สมาชิก ADTSpreadsheet สำหรับจัดการโปรแกรม การอบรม เอกสาร ข่าวสาร และกิจกรรมทั้งหมดของสมาชิก"
  >

  <link rel="icon" type="image/png" href="/assets/images/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Prompt:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --navy: #06152d;
      --navy-2: #0a2855;
      --blue: #1677ff;
      --blue-soft: #eaf3ff;
      --yellow: #ffc928;
      --green: #17b26a;
      --red: #ef3d48;
      --ink: #142033;
      --muted: #6c7a90;
      --line: #dce5ef;
      --surface: #f4f7fb;
      --white: #ffffff;
      --sidebar: 280px;
      --shadow: 0 16px 42px rgba(4, 27, 60, 0.10);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: "Prompt", sans-serif;
      color: var(--ink);
      background: var(--surface);
    }

    button,
    input {
      font: inherit;
    }

    a {
      color: inherit;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .app {
      min-height: 100vh;
    }

    /* =========================================================
       SIDEBAR
    ========================================================= */

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 1000;
      width: var(--sidebar);
      display: flex;
      flex-direction: column;
      color: #ffffff;
      background:
        radial-gradient(
          circle at 20% 5%,
          rgba(22, 119, 255, 0.28),
          transparent 28%
        ),
        linear-gradient(180deg, #06152d, #031025);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    .sidebar-head {
      min-height: 92px;
      display: flex;
      align-items: center;
      padding: 18px 22px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .sidebar-logo {
      width: 220px;
      max-height: 56px;
      object-fit: contain;
      object-position: left center;
    }

    .member-mini {
      margin: 18px;
      padding: 17px;
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 12px;
      align-items: center;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.11);
    }

    .member-mini-avatar {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 50%;
      color: var(--navy);
      background: var(--yellow);
      font-weight: 800;
    }

    .member-mini strong {
      display: block;
      font-size: 0.93rem;
    }

    .member-mini span {
      display: block;
      margin-top: 3px;
      color: #bcd0e7;
      font-size: 0.73rem;
    }

    .sidebar-nav {
      padding: 4px 14px 22px;
      display: grid;
      gap: 7px;
      overflow: auto;
    }

    .nav-group {
      padding: 15px 12px 5px;
      color: #7896b7;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .nav-link {
      min-height: 48px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: 13px;
      text-decoration: none;
      color: #d8e6f5;
      font-size: 0.88rem;
      font-weight: 600;
      transition: 0.2s;
    }

    .nav-link:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .nav-link.active {
      color: #ffffff;
      background: linear-gradient(135deg, var(--blue), #0d5fd1);
      box-shadow: 0 10px 26px rgba(22, 119, 255, 0.28);
    }

    .nav-icon {
      width: 24px;
      text-align: center;
      font-size: 1.05rem;
    }

    .sidebar-foot {
      /* โค้ดต้นฉบับที่ส่งมาถูกตัดตรงจุดนี้ */
    }
  </style>
</head>
<body>

  <!-- โค้ดที่ส่งมาในข้อความถูกตัดก่อนถึงส่วน body หลัก -->

</body>
</html>
