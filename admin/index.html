<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Login | ADT Control Center</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="icon" type="image/png" href="/assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#06152d;--navy2:#081d3f;--blue:#1677ff;--ink:#142033;--muted:#6c7a90;--line:#dce5ef}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Prompt",sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 10%,rgba(22,119,255,.14),transparent 30%),#f4f7fb}
button,input{font:inherit}.shell{width:min(950px,100%);min-height:560px;display:grid;grid-template-columns:1.05fr .95fr;overflow:hidden;border:1px solid var(--line);border-radius:28px;background:#fff;box-shadow:0 28px 80px rgba(4,27,60,.15)}
.brand{padding:50px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:radial-gradient(circle at 10% 10%,rgba(22,119,255,.35),transparent 30%),linear-gradient(160deg,#031025,var(--navy2))}
.logo{display:flex;gap:14px;align-items:center}.logo img{width:60px;height:60px;object-fit:contain;padding:5px;border-radius:16px;background:#fff}.logo strong{display:block;font:800 1.08rem Inter,sans-serif}.logo span{font-size:.68rem;color:rgba(255,255,255,.55);letter-spacing:.12em}
.copy h1{margin:12px 0;font-size:2.6rem;line-height:1.15}.copy small{color:#7db8ff;font-weight:700;letter-spacing:.12em}.copy p{color:rgba(255,255,255,.65);font-size:.8rem;line-height:1.8}.foot{font-size:.65rem;color:rgba(255,255,255,.38)}
.panel{padding:50px 46px;display:flex;flex-direction:column;justify-content:center}.panel h2{margin:0;font-size:1.75rem;color:var(--navy)}.panel>p{margin:8px 0 26px;color:var(--muted);font-size:.76rem}
.field{margin-bottom:16px}.field label{display:block;margin-bottom:7px;font-size:.72rem;font-weight:600;color:#40506a}.wrap{position:relative}.input{width:100%;height:48px;padding:0 13px;border:1px solid var(--line);border-radius:12px;outline:none}.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(22,119,255,.08)}.password{padding-right:70px}.toggle{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:.67rem;cursor:pointer}
.submit{width:100%;height:49px;margin-top:4px;border:0;border-radius:12px;color:#fff;background:linear-gradient(135deg,var(--blue),#0d57bf);font-weight:700;cursor:pointer}.submit:disabled{opacity:.65;cursor:wait}
.status{display:none;margin-top:15px;padding:11px 12px;border-radius:10px;font-size:.69rem;line-height:1.5}.status.show{display:block}.status.error{color:#991b1b;background:#fff1f2;border:1px solid #fecdd3}.status.info{color:#075fc4;background:#eaf3ff;border:1px solid #cfe2ff}.status.success{color:#166534;background:#ecfdf3;border:1px solid #bbf7d0}
@media(max-width:800px){.shell{grid-template-columns:1fr}.brand{min-height:250px;padding:30px}.copy h1{font-size:2rem}.foot{display:none}.panel{padding:35px 28px}}
</style>
</head>
<body>
<main class="shell">
<section class="brand">
<div class="logo"><img src="/assets/images/logo-icon.png" alt="ADTSpreadsheet"><div><strong>ADT Control Center</strong><span>ADMINISTRATION SYSTEM</span></div></div>
<div class="copy"><small>ADTSpreadsheet</small><h1>จัดการระบบธุรกิจ<br>จากศูนย์กลางเดียว</h1><p>ระบบสำหรับผู้ดูแล ADTSpreadsheet เพื่อจัดการข้อมูลลูกค้า งานออกแบบ การขาย การชำระเงิน และระบบภายใน</p></div>
<div class="foot">Authorized administrators only</div>
</section>
<section class="panel">
<h2>เข้าสู่ระบบ</h2><p>กรอกบัญชีผู้ดูแลระบบเพื่อเข้าสู่ ADT Control Center</p>
<form id="loginForm">
<div class="field"><label for="username">Username / Email</label><input class="input" id="username" autocomplete="username" required></div>
<div class="field"><label for="password">Password</label><div class="wrap"><input class="input password" id="password" type="password" autocomplete="current-password" required><button class="toggle" id="togglePassword" type="button">แสดง</button></div></div>
<button class="submit" id="loginButton" type="submit">เข้าสู่ระบบ</button>
<div class="status" id="statusBox"></div>
</form>
</section>
</main>
<script>
const API_BASE_URL="https://adt-website-api.onrender.com";
const LOGIN_API=`${API_BASE_URL}/api/admin/login`;
const DASHBOARD_URL="/admin/dashboard/";
const TOKEN_KEY="adt_admin_access_token";

const form=document.getElementById("loginForm");
const username=document.getElementById("username");
const password=document.getElementById("password");
const button=document.getElementById("loginButton");
const statusBox=document.getElementById("statusBox");
const toggle=document.getElementById("togglePassword");

function showStatus(message,type="info"){statusBox.className=`status show ${type}`;statusBox.textContent=message}
function setLoading(on){button.disabled=on;button.textContent=on?"กำลังเข้าสู่ระบบ...":"เข้าสู่ระบบ"}

toggle.addEventListener("click",()=>{
 const hidden=password.type==="password";
 password.type=hidden?"text":"password";
 toggle.textContent=hidden?"ซ่อน":"แสดง";
});

form.addEventListener("submit",async e=>{
 e.preventDefault();
 const user=username.value.trim();
 const pass=password.value;
 if(!user||!pass){showStatus("กรุณากรอก Username และ Password ให้ครบ","error");return}
 setLoading(true);
 try{
  const response=await fetch(LOGIN_API,{
   method:"POST",
   headers:{"Content-Type":"application/json","Accept":"application/json"},
   body:JSON.stringify({username:user,password:pass})
  });
  let result;
  try{result=await response.json()}catch{throw new Error(`Server ตอบกลับไม่ใช่ JSON (HTTP ${response.status})`)}
  if(!response.ok||result.success!==true)throw new Error(result.message||result.error||"Username หรือ Password ไม่ถูกต้อง");

  const token=result.admin_token||result.access_token||result.token||"";
  if(!token)throw new Error("Login สำเร็จ แต่ API ไม่ได้ส่ง Admin Token กลับมา");

  sessionStorage.setItem(TOKEN_KEY,token);
  localStorage.removeItem(TOKEN_KEY);
  if(result.admin)sessionStorage.setItem("adt_admin_profile",JSON.stringify(result.admin));

  showStatus("เข้าสู่ระบบสำเร็จ กำลังเปิด Dashboard...","success");
  window.location.assign(DASHBOARD_URL);
 }catch(err){
  console.error("Admin login error:",err);
  showStatus(err.message||"ไม่สามารถเข้าสู่ระบบได้","error");
  setLoading(false);
 }
});

window.addEventListener("DOMContentLoaded",()=>{
 username.focus();
 const oldToken=sessionStorage.getItem(TOKEN_KEY)||localStorage.getItem(TOKEN_KEY);
 if(oldToken)showStatus("พบ Admin Token เดิม หาก Session หมดอายุสามารถเข้าสู่ระบบใหม่ได้เลย","info");
});
</script>
</body>
</html>
