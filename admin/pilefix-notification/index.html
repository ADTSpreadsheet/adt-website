<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    ADT-PILEFiX | Admin Notification
</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    min-height: 100vh;

    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    background: #f2f5f9;

    color: #172033;

}


/* =========================================================
   HEADER
========================================================= */

.header {

    background:
        linear-gradient(
            135deg,
            #031a38,
            #075196
        );

    color: white;

    padding: 26px 20px;

}


.header-inner {

    max-width: 1100px;

    margin: auto;

}


.logo {

    font-size: 28px;

    font-weight: 800;

}


.logo span {

    color: #ffc83d;

}


.subtitle {

    margin-top: 4px;

    color:
        rgba(
            255,
            255,
            255,
            0.75
        );

    font-size: 14px;

}


/* =========================================================
   PAGE
========================================================= */

.container {

    max-width: 1100px;

    margin: 30px auto;

    padding: 0 18px 40px;

}


.card {

    background: white;

    border-radius: 16px;

    padding: 28px;

    box-shadow:
        0 8px 30px
        rgba(
            0,
            0,
            0,
            0.08
        );

    margin-bottom: 20px;

}


h2 {

    margin: 0;

    color: #082d59;

    font-size: 21px;

}


.section-head {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 20px;

}


/* =========================================================
   SUMMARY
========================================================= */

.summary {

    display: grid;

    grid-template-columns:
        repeat(
            3,
            1fr
        );

    gap: 14px;

    margin-bottom: 22px;

}


.summary-box {

    padding: 18px;

    background: #f6f8fb;

    border:
        1px solid
        #e0e6ed;

    border-radius: 12px;

}


.summary-label {

    color: #6c7785;

    font-size: 13px;

}


.summary-number {

    margin-top: 4px;

    color: #082d59;

    font-size: 25px;

    font-weight: 800;

}


/* =========================================================
   BUTTONS
========================================================= */

button {

    border: 0;

    border-radius: 9px;

    padding: 12px 17px;

    font-family: inherit;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

}


button:disabled {

    opacity: 0.5;

    cursor: not-allowed;

}


.reload-btn {

    background: #e8eef5;

    color: #163b60;

}


.select-btn {

    background: #e9eef5;

    color: #18344f;

}


.clear-btn {

    background: #f1f2f4;

    color: #5a6570;

}


.preview-btn {

    background: #e9eef5;

    color: #18344f;

}


.send-btn {

    flex: 1;

    background:
        linear-gradient(
            135deg,
            #eeb31d,
            #ffd45a
        );

    color: #08244a;

    font-size: 15px;

    padding: 15px 22px;

}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {

    display: flex;

    gap: 10px;

    align-items: center;

    margin-bottom: 16px;

    flex-wrap: wrap;

}


.search {

    flex: 1;

    min-width: 220px;

}


input,
textarea {

    width: 100%;

    border:
        1px solid
        #ccd5df;

    border-radius: 9px;

    padding: 12px 14px;

    font-family: inherit;

    font-size: 14px;

    outline: none;

}


input:focus,
textarea:focus {

    border-color: #075196;

}


/* =========================================================
   USERS TABLE
========================================================= */

.table-wrap {

    border:
        1px solid
        #e0e6ed;

    border-radius: 11px;

    overflow: auto;

    max-height: 430px;

}


table {

    width: 100%;

    border-collapse: collapse;

    min-width: 680px;

}


thead {

    position: sticky;

    top: 0;

    z-index: 2;

}


th {

    background: #f3f6fa;

    color: #425466;

    font-size: 13px;

    text-align: left;

    padding: 13px 12px;

    border-bottom:
        1px solid
        #dfe5ec;

}


td {

    padding: 13px 12px;

    border-bottom:
        1px solid
        #edf0f3;

    font-size: 14px;

}


tbody tr:hover {

    background: #fafbfd;

}


.check-col {

    width: 55px;

    text-align: center;

}


.user-check {

    width: 18px;

    height: 18px;

    cursor: pointer;

}


.booking {

    color: #075196;

    font-weight: 800;

}


.line-ok {

    display: inline-block;

    padding: 4px 9px;

    border-radius: 20px;

    background: #e7f8ed;

    color: #13713a;

    font-size: 12px;

    font-weight: 700;

}


.line-no {

    display: inline-block;

    padding: 4px 9px;

    border-radius: 20px;

    background: #fff0f0;

    color: #b02a2a;

    font-size: 12px;

    font-weight: 700;

}


.empty-row {

    text-align: center;

    padding: 35px;

    color: #778191;

}


/* =========================================================
   MESSAGE
========================================================= */

.field {

    margin-bottom: 22px;

}


.field-label {

    display: block;

    margin-bottom: 8px;

    font-weight: 700;

}


textarea {

    min-height: 220px;

    resize: vertical;

    line-height: 1.65;

}


.hint {

    margin-top: 7px;

    color: #778191;

    font-size: 12px;

}


/* =========================================================
   ATTACH DOWNLOAD LINK
========================================================= */

.attach-option {

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 14px 16px;

    background: #f7f9fc;

    border:
        1px solid
        #dce5ef;

    border-radius: 10px;

    margin-bottom: 12px;

    cursor: pointer;

    user-select: none;

}


.attach-option:hover {

    background: #f2f6fb;

}


.attach-option input {

    width: 19px;

    height: 19px;

    margin: 0;

    padding: 0;

    cursor: pointer;

    accent-color: #075196;

}


.attach-option-text {

    flex: 1;

}


.attach-title {

    color: #082d59;

    font-size: 14px;

    font-weight: 700;

}


.attach-description {

    margin-top: 3px;

    color: #778191;

    font-size: 12px;

}


.download-box {

    padding: 14px;

    border:
        1px solid
        #dce5ef;

    border-radius: 9px;

    background: #f5f8fc;

    word-break: break-all;

    font-size: 14px;

    transition:
        opacity 0.2s ease,
        background 0.2s ease;

}


.download-box.disabled {

    opacity: 0.4;

    background: #f1f1f1;

}


.actions {

    display: flex;

    gap: 12px;

}


/* =========================================================
   PREVIEW
========================================================= */

.preview {

    display: none;

    white-space: pre-wrap;

    background: #f7f8fa;

    padding: 20px;

    border-radius: 10px;

    line-height: 1.65;

}


/* =========================================================
   STATUS
========================================================= */

.status {

    display: none;

    margin-top: 18px;

    padding: 14px 16px;

    border-radius: 9px;

    line-height: 1.5;

    white-space: pre-line;

}


.status.success {

    display: block;

    background: #eaf8ef;

    color: #176b38;

}


.status.error {

    display: block;

    background: #fff0f0;

    color: #a62a2a;

}


.status.info {

    display: block;

    background: #eef5ff;

    color: #175a9c;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 700px) {

    .card {

        padding: 20px;

    }


    .summary {

        grid-template-columns: 1fr;

    }


    .section-head {

        align-items: flex-start;

        flex-direction: column;

    }


    .actions {

        flex-direction: column;

    }


    .send-btn {

        width: 100%;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <div class="header-inner">

        <div class="logo">
            ADT-PILE<span>FiX</span>
        </div>

        <div class="subtitle">
            Professional Notification Center
        </div>

    </div>

</div>



<div class="container">


    <!-- =================================================
         USERS
    ================================================= -->

    <div class="card">


        <div class="section-head">

            <h2>
                ผู้ใช้งาน ADT-PILEFiX
            </h2>


            <button
                id="reloadButton"
                class="reload-btn"
                type="button"
            >
                REFRESH USERS
            </button>

        </div>



        <div class="summary">


            <div class="summary-box">

                <div class="summary-label">
                    ผู้ใช้งานทั้งหมด
                </div>

                <div
                    class="summary-number"
                    id="totalUsers"
                >
                    0
                </div>

            </div>


            <div class="summary-box">

                <div class="summary-label">
                    เชื่อม LINE แล้ว
                </div>

                <div
                    class="summary-number"
                    id="lineUsers"
                >
                    0
                </div>

            </div>


            <div class="summary-box">

                <div class="summary-label">
                    เลือกส่งข้อความ
                </div>

                <div
                    class="summary-number"
                    id="selectedUsers"
                >
                    0
                </div>

            </div>


        </div>



        <div class="toolbar">


            <div class="search">

                <input
                    id="searchInput"
                    type="text"
                    placeholder="ค้นหา PF หรือชื่อผู้ใช้งาน..."
                >

            </div>


            <button
                id="selectAllButton"
                class="select-btn"
                type="button"
            >
                SELECT ALL
            </button>


            <button
                id="clearAllButton"
                class="clear-btn"
                type="button"
            >
                CLEAR
            </button>


        </div>



        <div class="table-wrap">


            <table>


                <thead>

                    <tr>

                        <th class="check-col">
                            เลือก
                        </th>

                        <th>
                            Booking No.
                        </th>

                        <th>
                            ชื่อผู้ใช้งาน
                        </th>

                        <th>
                            LINE
                        </th>

                    </tr>

                </thead>


                <tbody id="usersTableBody">

                    <tr>

                        <td
                            colspan="4"
                            class="empty-row"
                        >
                            กำลังโหลดข้อมูล...
                        </td>

                    </tr>

                </tbody>


            </table>


        </div>


        <div
            id="usersStatus"
            class="status"
        ></div>


    </div>



    <!-- =================================================
         MESSAGE
    ================================================= -->

    <div class="card">


        <h2 style="margin-bottom:22px;">
            ส่งข้อความ
        </h2>



        <div class="field">


            <label
                class="field-label"
                for="message"
            >
                ข้อความ
            </label>


            <textarea id="message">📢 ADT-PILEFiX Professional

ขณะนี้มีโปรแกรมเวอร์ชันใหม่พร้อมให้ดาวน์โหลดแล้วครับ

กรุณาดาวน์โหลดไฟล์เวอร์ชันล่าสุดเพื่อใช้งานแทนไฟล์เดิม

หลังเปิดโปรแกรม ให้กรอกหมายเลข PF ของท่าน และกด REQUEST เพื่อรับรหัสเข้าใช้งานทาง LINE

ดาวน์โหลดโปรแกรมได้จากลิงก์ด้านล่าง</textarea>


            <div class="hint">
                สามารถแก้ไขข้อความได้ก่อนส่ง
            </div>


        </div>



        <!-- =============================================
             ATTACH DOWNLOAD LINK
        ============================================== -->

        <div class="field">


            <label
                class="attach-option"
                for="attachDownloadLink"
            >


                <input
                    type="checkbox"
                    id="attachDownloadLink"
                    checked
                >


                <div class="attach-option-text">

                    <div class="attach-title">
                        แนบลิงก์ดาวน์โหลด ADT-PILEFiX
                    </div>

                    <div class="attach-description">
                        หากไม่ต้องการส่งลิงก์ดาวน์โหลด ให้เอาเครื่องหมายถูกออก
                    </div>

                </div>


            </label>



            <div
                class="download-box"
                id="downloadUrl"
            >
                https://adtspreadsheet.com/software/pilefix/download/
            </div>


        </div>



        <div class="actions">


            <button
                class="preview-btn"
                id="previewButton"
                type="button"
            >
                PREVIEW
            </button>


            <button
                class="send-btn"
                id="sendButton"
                type="button"
            >
                SEND LINE MESSAGE
            </button>


        </div>



        <div
            id="sendStatus"
            class="status"
        ></div>


    </div>



    <!-- =================================================
         PREVIEW
    ================================================= -->

    <div class="card">


        <h2 style="margin-bottom:20px;">
            ตัวอย่างข้อความ
        </h2>


        <div
            id="preview"
            class="preview"
        ></div>


    </div>


</div>



<script>


/* ========================================================
   API
======================================================== */

const API_BASE =
    "https://adt-website-api.onrender.com";


const USERS_API =
    API_BASE +
    "/api/pilefix/notification/users";


const SEND_API =
    API_BASE +
    "/api/pilefix/notification/send";


const DOWNLOAD_URL =
    "https://adtspreadsheet.com/software/pilefix/download/";



/* ========================================================
   ELEMENTS
======================================================== */

const usersTableBody =
    document.getElementById(
        "usersTableBody"
    );


const totalUsersElement =
    document.getElementById(
        "totalUsers"
    );


const lineUsersElement =
    document.getElementById(
        "lineUsers"
    );


const selectedUsersElement =
    document.getElementById(
        "selectedUsers"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const messageInput =
    document.getElementById(
        "message"
    );


const preview =
    document.getElementById(
        "preview"
    );


const usersStatus =
    document.getElementById(
        "usersStatus"
    );


const sendStatus =
    document.getElementById(
        "sendStatus"
    );


const sendButton =
    document.getElementById(
        "sendButton"
    );


const reloadButton =
    document.getElementById(
        "reloadButton"
    );


const attachDownloadLink =
    document.getElementById(
        "attachDownloadLink"
    );


const downloadUrlBox =
    document.getElementById(
        "downloadUrl"
    );



/* ========================================================
   DATA
======================================================== */

let users = [];



/* ========================================================
   ATTACH DOWNLOAD LINK
======================================================== */

function updateDownloadLinkState() {


    if (
        attachDownloadLink.checked
    ) {

        downloadUrlBox
            .classList
            .remove(
                "disabled"
            );

    } else {

        downloadUrlBox
            .classList
            .add(
                "disabled"
            );

    }

}


attachDownloadLink.addEventListener(
    "change",
    function () {

        updateDownloadLinkState();

    }
);



/* ========================================================
   LOAD USERS
======================================================== */

async function loadUsers() {


    setUsersStatus(
        "กำลังโหลดข้อมูลผู้ใช้งาน...",
        "info"
    );


    reloadButton.disabled =
        true;


    try {


        const response =
            await fetch(
                USERS_API,
                {
                    method: "GET",

                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "ไม่สามารถโหลดข้อมูลผู้ใช้งานได้"
            );

        }


        users =
            Array.isArray(
                data.users
            )
                ? data.users
                : [];


        users =
            users.map(
                user => ({

                    booking_no:
                        String(
                            user.booking_no || ""
                        )
                        .trim()
                        .toUpperCase(),

                    name:
                        String(
                            user.name || "-"
                        ),

                    has_line:
                        user.has_line === true,

                    selected:
                        false

                })
            );


        renderUsers();


        setUsersStatus(
            "โหลดข้อมูลผู้ใช้งานเรียบร้อยแล้ว",
            "success"
        );


    }
    catch (error) {


        users = [];


        renderUsers();


        setUsersStatus(
            error.message,
            "error"
        );


    }
    finally {


        reloadButton.disabled =
            false;

    }

}



/* ========================================================
   RENDER USERS
======================================================== */

function renderUsers() {


    const keyword =
        searchInput.value
            .trim()
            .toLowerCase();


    const filteredUsers =
        users.filter(
            user => {


                if (!keyword) {

                    return true;

                }


                return (

                    user.booking_no
                        .toLowerCase()
                        .includes(
                            keyword
                        )

                    ||

                    user.name
                        .toLowerCase()
                        .includes(
                            keyword
                        )

                );

            }
        );


    usersTableBody.innerHTML =
        "";


    if (
        filteredUsers.length === 0
    ) {


        usersTableBody.innerHTML = `

            <tr>

                <td
                    colspan="4"
                    class="empty-row"
                >
                    ไม่พบข้อมูลผู้ใช้งาน
                </td>

            </tr>

        `;


        updateSummary();


        return;

    }


    filteredUsers.forEach(
        user => {


            const row =
                document.createElement(
                    "tr"
                );


            const checkboxDisabled =
                !user.has_line;


            row.innerHTML = `

                <td class="check-col">

                    <input
                        type="checkbox"
                        class="user-check"
                        data-booking="${escapeHtml(user.booking_no)}"
                        ${user.selected ? "checked" : ""}
                        ${checkboxDisabled ? "disabled" : ""}
                    >

                </td>


                <td>

                    <span class="booking">
                        ${escapeHtml(user.booking_no)}
                    </span>

                </td>


                <td>
                    ${escapeHtml(user.name)}
                </td>


                <td>

                    ${
                        user.has_line

                        ?

                        `<span class="line-ok">
                            CONNECTED
                         </span>`

                        :

                        `<span class="line-no">
                            NO LINE
                         </span>`
                    }

                </td>

            `;


            usersTableBody
                .appendChild(
                    row
                );

        }
    );


    document
        .querySelectorAll(
            ".user-check"
        )
        .forEach(
            checkbox => {


                checkbox.addEventListener(
                    "change",
                    function () {


                        const booking =
                            this.dataset.booking;


                        const user =
                            users.find(
                                item =>
                                    item.booking_no ===
                                    booking
                            );


                        if (user) {

                            user.selected =
                                this.checked;

                        }


                        updateSummary();

                    }
                );

            }
        );


    updateSummary();

}



/* ========================================================
   SUMMARY
======================================================== */

function updateSummary() {


    const totalUsers =
        users.length;


    const lineUsers =
        users.filter(
            user =>
                user.has_line
        ).length;


    const selectedUsers =
        users.filter(
            user =>
                user.has_line &&
                user.selected
        ).length;


    totalUsersElement.textContent =
        totalUsers;


    lineUsersElement.textContent =
        lineUsers;


    selectedUsersElement.textContent =
        selectedUsers;


    sendButton.textContent =
        selectedUsers > 0

            ? `SEND LINE MESSAGE (${selectedUsers})`

            : "SEND LINE MESSAGE";

}



/* ========================================================
   SELECT ALL
======================================================== */

document
    .getElementById(
        "selectAllButton"
    )
    .addEventListener(
        "click",
        function () {


            const keyword =
                searchInput.value
                    .trim()
                    .toLowerCase();


            users.forEach(
                user => {


                    if (
                        !user.has_line
                    ) {

                        return;

                    }


                    const visible =

                        !keyword

                        ||

                        user.booking_no
                            .toLowerCase()
                            .includes(
                                keyword
                            )

                        ||

                        user.name
                            .toLowerCase()
                            .includes(
                                keyword
                            );


                    if (visible) {

                        user.selected =
                            true;

                    }

                }
            );


            renderUsers();

        }
    );



/* ========================================================
   CLEAR ALL
======================================================== */

document
    .getElementById(
        "clearAllButton"
    )
    .addEventListener(
        "click",
        function () {


            users.forEach(
                user => {

                    user.selected =
                        false;

                }
            );


            renderUsers();

        }
    );



/* ========================================================
   SEARCH
======================================================== */

searchInput.addEventListener(
    "input",
    renderUsers
);



/* ========================================================
   REFRESH USERS
======================================================== */

reloadButton.addEventListener(
    "click",
    loadUsers
);



/* ========================================================
   PREVIEW
======================================================== */

document
    .getElementById(
        "previewButton"
    )
    .addEventListener(
        "click",
        function () {


            const text =
                messageInput.value
                    .trim();


            if (!text) {


                setSendStatus(
                    "กรุณากรอกข้อความ",
                    "error"
                );


                return;

            }


            let previewText =
                text;


            if (
                attachDownloadLink.checked
            ) {

                previewText +=
                    "\n\n" +
                    DOWNLOAD_URL;

            }


            preview.textContent =
                previewText;


            preview.style.display =
                "block";


            preview.scrollIntoView({
                behavior:
                    "smooth",

                block:
                    "center"
            });

        }
    );



/* ========================================================
   SEND LINE MESSAGE
======================================================== */

sendButton.addEventListener(
    "click",
    async function () {


        clearSendStatus();


        const selectedBookings =
            users

                .filter(
                    user =>
                        user.has_line &&
                        user.selected
                )

                .map(
                    user =>
                        user.booking_no
                );


        const text =
            messageInput.value
                .trim();


        if (
            selectedBookings.length === 0
        ) {


            setSendStatus(
                "กรุณาเลือกผู้ใช้งานอย่างน้อย 1 คน",
                "error"
            );


            return;

        }


        if (!text) {


            setSendStatus(
                "กรุณากรอกข้อความที่ต้องการส่ง",
                "error"
            );


            return;

        }


        let confirmMessage =

            "ยืนยันส่งข้อความ LINE ถึง " +
            selectedBookings.length +
            " คน";


        if (
            attachDownloadLink.checked
        ) {

            confirmMessage +=
                "\n\nพร้อมแนบลิงก์ดาวน์โหลด ADT-PILEFiX";

        } else {

            confirmMessage +=
                "\n\nไม่แนบลิงก์ดาวน์โหลด";

        }


        confirmMessage +=
            "\n\nต้องการดำเนินการต่อหรือไม่?";


        if (
            !window.confirm(
                confirmMessage
            )
        ) {

            return;

        }


        sendButton.disabled =
            true;


        reloadButton.disabled =
            true;


        sendButton.textContent =
            "SENDING...";


        try {


            const response =
                await fetch(
                    SEND_API,
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"

                        },


                        body:
                            JSON.stringify({

                                booking_numbers:
                                    selectedBookings,

                                message:
                                    text,

                                download_url:
                                    attachDownloadLink.checked
                                        ? DOWNLOAD_URL
                                        : ""

                            })

                    }
                );


            const data =
                await response.json();


            if (
                !response.ok
            ) {


                throw new Error(
                    data.message ||
                    "ไม่สามารถส่งข้อความ LINE ได้"
                );

            }


            let resultMessage =
                data.message ||
                "ส่งข้อความเรียบร้อยแล้ว";


            if (
                data.sent !==
                undefined
            ) {

                resultMessage +=
                    "\nส่งสำเร็จ: " +
                    data.sent +
                    " คน";

            }


            if (
                data.failed !==
                undefined
            ) {

                resultMessage +=
                    "\nส่งไม่สำเร็จ: " +
                    data.failed +
                    " คน";

            }


            setSendStatus(
                resultMessage,
                "success"
            );


        }
        catch (error) {


            setSendStatus(
                error.message,
                "error"
            );


        }
        finally {


            sendButton.disabled =
                false;


            reloadButton.disabled =
                false;


            updateSummary();

        }

    }
);



/* ========================================================
   STATUS
======================================================== */

function setUsersStatus(
    text,
    type
) {


    usersStatus.className =
        "status " +
        type;


    usersStatus.textContent =
        text;

}



function setSendStatus(
    text,
    type
) {


    sendStatus.className =
        "status " +
        type;


    sendStatus.textContent =
        text;

}



function clearSendStatus() {


    sendStatus.className =
        "status";


    sendStatus.textContent =
        "";

}



/* ========================================================
   HTML ESCAPE
======================================================== */

function escapeHtml(value) {


    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}



/* ========================================================
   START
======================================================== */

updateDownloadLinkState();

loadUsers();


</script>
